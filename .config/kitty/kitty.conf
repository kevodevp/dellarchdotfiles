# kitty configuration - dark theme
# https://sw.kovidgoyal.net/kitty/conf/

font_family      Noto Sans Mono
font_size        11.0

# Dark colour scheme (Breeze-inspired, matches the rest of the desktop)
foreground        #eff0f1
background        #232629
selection_foreground #232629
selection_background #3daee9
cursor            #eff0f1
cursor_text_color #232629
url_color         #3daee9
active_border_color  #3daee9
inactive_border_color #4c4f52
active_tab_foreground #232629
active_tab_background #eff0f1
inactive_tab_foreground #bdc3c7
inactive_tab_background #31363b
bell_border_color #3daee9

color0           #232629
color8           #7f8c8d
color1           #e06060
color9           #ff8080
color2           #60be78
color10          #8ce099
color3           #d8a657
color11          #f0c674
color4           #53b7ec
color12          #71d3f6
color5           #b48ead
color13          #d4b1dc
color6           #6ec7c7
color14          #8ce5e5
color7           #d3d7cf
color15          #ffffff

# Window padding & borders
window_padding_width 8
background_opacity   1.0

# Scrollback
scrollback_pager      no
scrollback_lines      10000

# Mouse
mouse_hide_wait       3.0
url_modifier          ctrl

# Shell integration
shell_integration confirm

# Kitty's own theme file (generated by kitty's theme detection) is merged in
# automatically; the explicit colours above take precedence.
